<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Alas · layout</title>
<script src="../app/desenho.js"></script>
<style>
  :root{--bg:#eef1f4;--card:#fff;--ink:#1d2430;--muted:#5b6676;--line:#d9dee5;--accent:#1f6f5c;--accent-soft:#e3f2ec;--concreto:#bfe9cc}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.35 'IBM Plex Sans','Segoe UI',Arial,sans-serif}
  header{background:#17212e;color:#fff;padding:12px 22px;display:flex;align-items:baseline;gap:14px}
  header h1{margin:0;font-size:19px;letter-spacing:.3px}
  header .sub{color:#aab6c5;font-size:12.5px}
  header .ver{margin-left:auto;color:#aab6c5;font-size:12px}
  .tabs{display:flex;gap:2px;padding:0 22px;background:#17212e}
  .tabs span{padding:8px 16px;color:#aab6c5;font-size:12.5px;border-radius:6px 6px 0 0}
  .tabs span.on{background:var(--bg);color:var(--ink);font-weight:600}
  .tabs span.off{opacity:.5}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px}
  .card h2{margin:0;font-size:13px;font-weight:600;padding:9px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .card h2 .esc{margin-left:auto;color:var(--muted);font-weight:400;font-size:12px}
  .n{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;align-items:center;justify-content:center}
  .grp{padding:10px 14px 4px}
  .grp h3{margin:0 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent)}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 10px}
  .f{min-width:0}
  .grid.one{grid-template-columns:1fr}
  .f label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:2px}
  .f .in{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#fbfcfd}
  .f .in input{flex:1;min-width:0;border:0;background:transparent;padding:4px 7px;font:inherit;font-variant-numeric:tabular-nums}
  .f .in span{padding:4px 7px;color:var(--muted);background:#f1f3f6;border-left:1px solid var(--line);font-size:11.5px}
  .calc{margin:8px 14px 12px;background:var(--accent-soft);border-radius:6px;padding:8px 10px;font-size:12px}
  .calc table{width:100%;border-collapse:collapse}
  .calc td{padding:2px 0}
  .calc td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .fig{padding:6px 10px 10px}
  .note{font-size:11.5px;color:var(--muted);padding:0 14px 10px}
  .badge{font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:1px 6px;margin-left:6px}
  /* layout A */
  .A main{display:grid;grid-template-columns:370px minmax(0,1fr);gap:14px;padding:14px 22px}
  .A aside .card{position:sticky;top:0}
  .A .right{display:grid;gap:14px}
  .A .fig{height:470px}
  .A .cut .fig{height:430px}
  /* layout B */
  .B main{display:grid;gap:14px;padding:14px 22px}
  .B .row{display:grid;grid-template-columns:300px minmax(0,1fr);}
  .B .row .side{border-right:1px solid var(--line)}
  .B .fig{height:440px}
  .B .cut .fig{height:420px}
  .tag{position:absolute;top:10px;right:14px;background:#f7c948;color:#3d2f00;font-weight:700;padding:3px 9px;border-radius:5px;font-size:12px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const L = new URLSearchParams(location.search).get('l') || 'A';
const p = AlasGeo.DEF, d = AlasGeo.derive(p), f = AlasGeo.f0;
const F = (lab, v, u = 'cm') => `<div class="f"><label>${lab}</label><div class="in"><input value="${f(v)}"><span>${u}</span></div></div>`;
const G = (t, html, one) => `<div class="grp"><h3>${t}</h3><div class="grid${one ? ' one' : ''}">${html}</div></div>`;
const tubo = G('Tubo', F('Diâmetro externo, D', p.D));
const testa = G('Testa', F('Espessura, e<sub>t</sub>', p.et) + F('Altura acima da laje, H<sub>t</sub>', p.Ht));
const alas = G('Alas', F('Espessura, e<sub>a</sub>', p.ea) + F('Comprimento em planta, L<sub>a</sub>', p.La) + F('Abertura junto à testa, b<sub>1</sub>', p.b1) + F('Abertura na ponta, b<sub>2</sub>', p.b2) + F('Altura na ponta, H<sub>p</sub>', p.Hp));
const laje = G('Laje de fundo', F('Espessura, e<sub>l</sub>', p.el) + F('Lastro de concreto magro', p.lm));
const engr = G('Engrossamento sob a testa', F('Espessura total, e<sub>g</sub>', p.eg) + F('Largura, b<sub>g</sub>', p.bg));
const dente = G('Dente na ponta', F('Profundidade abaixo da laje, h<sub>d</sub>', p.hd) + F('Largura, b<sub>d</sub>', p.bd));
const calc = rows => `<div class="calc"><table>${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div>`;
const calcPlan = [['Comprimento da testa', f(d.Lt) + ' cm'], ['Largura total na ponta', f(d.Btot) + ' cm'], ['Abertura de cada ala', f(d.angDeg) + '°'], ['Comprimento inclinado da ala', f(d.Ls) + ' cm']];
const calcCut = [['Comprimento total', f(d.Ltot) + ' cm'], ['Cobrimento acima do tubo', f(d.cob) + ' cm'], ['Altura total na ponta', f(p.Hp + p.el + p.hd) + ' cm']];
const head = `<header><h1>Alas</h1><span class="sub">Alas de bueiro em concreto armado: geometria, esforços por elementos finitos e armaduras</span><span class="ver">v0.1 · cm</span></header>`;
const tabs = `<div class="tabs"><span class="on">Geometria</span><span class="off">Esforços</span><span class="off">Armaduras</span><span class="off">Memorial</span></div>`;
const plan = h => `<section class="card plan"><h2><span class="n">1</span>Planta <span class="esc">medidas em cm</span></h2><div class="fig">${AlasGeo.plan(p, 760, h)}</div></section>`;
const cut = h => `<section class="card cut"><h2><span class="n">2</span>Corte A <span class="esc">pelo eixo do tubo · medidas em cm</span></h2><div class="fig">${AlasGeo.cut(p, 760, h)}</div></section>`;
let html;
if (L === 'A') {
  html = `<div class="A" style="position:relative">${head}${tabs}<span class="tag">Layout A · painel lateral</span><main>
    <aside><section class="card"><h2>Dados da geometria</h2>${tubo}${testa}${alas}${laje}${engr}${dente}
      <h3 style="margin:10px 14px 0;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent)">Grandezas calculadas</h3>${calc(calcPlan.concat(calcCut))}</section></aside>
    <div class="right">${plan(470)}${cut(430)}</div></main></div>`;
} else {
  html = `<div class="B" style="position:relative">${head}${tabs}<span class="tag">Layout B · dados junto de cada desenho</span><main>
    <section class="card plan"><h2><span class="n">1</span>Planta <span class="esc">medidas em cm</span></h2><div class="row"><div class="side">${tubo}${testa}${alas}${calc(calcPlan)}</div><div class="fig">${AlasGeo.plan(p, 860, 440)}</div></div></section>
    <section class="card cut"><h2><span class="n">2</span>Corte A <span class="esc">pelo eixo do tubo · medidas em cm</span></h2><div class="row"><div class="side">${laje}${engr}${dente}${calc(calcCut)}</div><div class="fig">${AlasGeo.cut(p, 860, 420)}</div></div></section>
  </main></div>`;
}
document.getElementById('root').innerHTML = html;
</script>
</body>
</html>
